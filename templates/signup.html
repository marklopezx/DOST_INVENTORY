<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up | DOST INVENTORY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1e40af;
            --secondary-blue: #3b82f6;
            --bg: #f8fafc;
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            color: var(--text-dark);
            padding: 24px 16px;
            /* Protects card from touching edges on small viewports */
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
        }

        .logo-wrapper {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .logo-wrapper img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        h2 {
            margin: 0 0 10px 0;
            color: var(--primary-blue);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        /* Context Container to isolate absolute icons cleanly */
        .input-container-ctx {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-container-ctx i.input-icon {
            position: absolute;
            left: 15px;
            color: #94a3b8;
            pointer-events: none;
            font-size: 15px;
            z-index: 10;
        }

        /* Interactive Eye Icon Configuration */
        .password-toggle-btn {
            position: absolute;
            right: 15px;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 20;
            padding: 6px;
            /* Increases clickable tap target for fingers */
        }

        .password-toggle-btn:hover {
            color: var(--secondary-blue);
        }

        input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            /* Added right padding for safety clearance against the eye */
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 14px;
            color: var(--text-dark);
            height: 46px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 5px;
            height: 48px;
        }

        .btn-login:hover {
            background: #1e3a8a;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .flash-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            border-left: 4px solid #ef4444;
            text-align: left;
            font-weight: 500;
            word-break: break-word;
        }

        .footer-link {
            margin-top: 24px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-link a {
            color: var(--secondary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        /* ==========================================================================
           ADVANCED BREAKPOINT DESIGN FOR ULTRA-COMPACT MOBILE ENGINE
           ========================================================================== */
        @media (max-width: 480px) {
            body {
                background: #ffffff;
                /* Smooth clean flat style matching login view specs */
                padding: 10px 0;
                align-items: flex-start;
            }

            .login-container {
                max-width: 100%;
            }

            .login-card {
                box-shadow: none;
                border-radius: 0;
                padding: 25px 20px;
            }

            h2 {
                font-size: 22px;
            }

            /* Overrides font layout sizes on mobile screens to suppress unwanted scaling loops */
            input {
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrapper">
                <img src="/static/dost_logo.png" alt="DOST Logo">
            </div>

            <h2>Create Account</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Register for the Inventory System</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="flash-error">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="/signup" method="POST">
                <div class="form-group">
                    <label>First Name</label>
                    <div class="input-container-ctx">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" name="first_name" placeholder="Enter your first name"
                            autocomplete="given-name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <div class="input-container-ctx">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="last_name" placeholder="Enter your surname" autocomplete="family-name"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-container-ctx">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" placeholder="email@dost.gov.ph" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-container-ctx">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="passwordField" name="password" placeholder="Min. 6 characters"
                            minlength="6" required>
                        <i class="fas fa-eye password-toggle-btn" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">Register Now</button>
            </form>

            <p class="footer-link">
                Already have an account? <a href="/login_page">Log in here</a>
            </p>
        </div>
    </div>

    <script>
        const passwordField = document.getElementById('passwordField');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function () {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);

            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>

</html>
